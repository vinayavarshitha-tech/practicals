<!DOCTYPE html>
<html>
<head>
    <title>Auto Save Form</title>
</head>
<body>

<h1>Auto Save Form Data</h1>

<input id="name" placeholder="Enter name">
<br><br>
<input id="email" placeholder="Enter email">

<p>Data is automatically saved.</p>

<script>
let nameInput = document.getElementById("name");
let emailInput = document.getElementById("email");

nameInput.value = localStorage.getItem("autoName") || "";
emailInput.value = localStorage.getItem("autoEmail") || "";

nameInput.addEventListener("input", function() {
    localStorage.setItem("autoName", nameInput.value);
});

emailInput.addEventListener("input", function() {
    localStorage.setItem("autoEmail", emailInput.value);
});
</script>

<br>
<a href="index.html">Back to Programs</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Example</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center">Bootstrap Webpage</h1>

        <div class="card mt-4">
            <div class="card-body">
                <h2 class="card-title">Welcome</h2>
                <p class="card-text">
                    This webpage uses Bootstrap components.
                </p>

                <button class="btn btn-primary">
                    Click Me
                </button>
            </div>
        </div>

    </div>

</body>
</html>

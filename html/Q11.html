<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: center;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>CSS Styling</h1>

    <p>This paragraph uses internal CSS.</p>

    <h2>This uses external CSS.</h2>

</body>
</html>

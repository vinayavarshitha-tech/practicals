<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>

        /* Element selector */
        h1 {
            color: blue;
            font-family: Arial;
        }

        /* Class selector */
        .box {
            background-color: lightgray;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

        /* ID selector */
        #special {
            color: red;
            font-size: 25px;
        }

    </style>
</head>
<body>

    <h1>CSS Demonstration</h1>

    <div class="box">
        This box demonstrates margin, padding and border.
    </div>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

</body>
</html>

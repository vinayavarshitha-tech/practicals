<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h1>HTML Lists</h1>

    <h2>Ordered List</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Python</li>
        <li>C</li>
        <li>Java</li>
    </ul>

    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Used to create webpage structure.</dd>

        <dt>CSS</dt>
        <dd>Used to style webpages.</dd>
    </dl>

</body>
</html>

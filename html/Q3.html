<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Student Table</h1>

    <table>
        <tr>
            <th colspan="3">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>CSE</td>
        </tr>

        <tr>
            <td rowspan="2">Priya</td>
            <td>21</td>
            <td>ECE</td>
        </tr>

        <tr>
            <td>22</td>
            <td>IT</td>
        </tr>
    </table>

</body>
</html>

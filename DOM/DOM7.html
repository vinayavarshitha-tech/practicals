<!DOCTYPE html>
<html>
<head>
    <title>DOM 7 - CSS Classes</title>

    <style>
        .highlight {
            background-color: yellow;
            color: blue;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1 id="text">Dynamic CSS Class</h1>

    <button onclick="addClass()">Add Class</button>
    <button onclick="removeClass()">Remove Class</button>

    <br><br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        function addClass() {
            document.getElementById("text").classList.add("highlight");
        }

        function removeClass() {
            document.getElementById("text").classList.remove("highlight");
        }
    </script>

</body>
</html>

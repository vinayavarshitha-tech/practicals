<!DOCTYPE html>
<html>
<head>
    <title>DOM 11 - Character Counter</title>
</head>
<body>

    <h1>Live Character Counter</h1>

    <textarea id="message" oninput="countCharacters()"
        rows="5" cols="40"></textarea>

    <p>Characters: <span id="count">0</span></p>

    <br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        function countCharacters() {

            let text = document.getElementById("message").value;

            document.getElementById("count").textContent = text.length;
        }
    </script>

</body>
</html>

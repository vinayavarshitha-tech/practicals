<!DOCTYPE html>
<html>
<head>
    <title>DOM 15 - Image Slideshow</title>
</head>
<body>

    <h1>Image Slideshow</h1>

    <img id="slide"
         src="https://picsum.photos/500/300?1"
         width="500"
         height="300">

    <br><br>

    <button onclick="previousImage()">Previous</button>
    <button onclick="nextImage()">Next</button>

    <br><br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        let images = [
            "https://picsum.photos/500/300?1",
            "https://picsum.photos/500/300?2",
            "https://picsum.photos/500/300?3",
            "https://picsum.photos/500/300?4"
        ];

        let current = 0;

        function nextImage() {

            current++;

            if (current >= images.length) {
                current = 0;
            }

            document.getElementById("slide").src = images[current];
        }

        function previousImage() {

            current--;

            if (current < 0) {
                current = images.length - 1;
            }

            document.getElementById("slide").src = images[current];
        }
    </script>

</body>
</html>

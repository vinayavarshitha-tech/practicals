<!DOCTYPE html>
<html>
<head>
    <title>DOM 5 - DOM Methods</title>
</head>
<body>

    <h1 id="title">DOM Selection Methods</h1>

    <p class="para">Paragraph 1</p>
    <p class="para">Paragraph 2</p>

    <button onclick="useMethods()">Use DOM Methods</button>

    <br><br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        function useMethods() {

            let heading = document.getElementById("title");
            heading.style.color = "blue";

            let paragraphs = document.getElementsByClassName("para");

            for (let i = 0; i < paragraphs.length; i++) {
                paragraphs[i].style.color = "green";
            }
        }
    </script>

</body>
</html>

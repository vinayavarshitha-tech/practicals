<!DOCTYPE html>
<html>
<head>
    <title>DOM 6 - Query Selectors</title>
</head>
<body>

    <h1>Query Selector Methods</h1>

    <p class="item">Item 1</p>
    <p class="item">Item 2</p>
    <p class="item">Item 3</p>

    <button onclick="selectElements()">Select Elements</button>

    <br><br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        function selectElements() {

            let first = document.querySelector(".item");
            first.style.color = "red";

            let all = document.querySelectorAll(".item");

            all.forEach(function(item) {
                item.style.fontWeight = "bold";
            });
        }
    </script>

</body>
</html>

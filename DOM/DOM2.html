<!DOCTYPE html>
<html>
<head>
    <title>DOM 2 - Remove Elements</title>
</head>
<body>

    <h1>Remove HTML Elements Dynamically</h1>

    <p id="text">This paragraph can be removed.</p>

    <button onclick="removeElement()">Remove Paragraph</button>

    <br><br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        function removeElement() {
            let element = document.getElementById("text");
            element.remove();
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Event 4 - Double Click</title>
</head>

<body>

    <h1>Double-Click Event</h1>

    <button ondblclick="doubleClick()">
        Double Click Me
    </button>

    <p id="message">Waiting for double-click...</p>

    <br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        function doubleClick() {
            document.getElementById("message").textContent =
                "Button was double-clicked!";
        }
    </script>

</body>
</html>

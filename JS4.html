<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>

<body>

    <h1>Even or Odd</h1>

    <p id="output"></p>

    <script>
        let number = 12;

        if (number % 2 === 0) {
            document.getElementById("output").innerHTML =
                number + " is Even";
        } else {
            document.getElementById("output").innerHTML =
                number + " is Odd";
        }
    </script>

</body>
</html>

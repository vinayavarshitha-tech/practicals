<!DOCTYPE html>
<html>
<head>
    <title>Browser 13 - Navigator Object</title>
</head>
<body>

    <h1>Navigator Object</h1>

    <button onclick="showBrowser()">Show Information</button>

    <p id="output"></p>

    <br>
    <a href="../index.html">← Back to Programs</a>

    <script>
        function showBrowser() {

            document.getElementById("output").innerHTML =
                "Browser: " + navigator.userAgent +
                "<br>Language: " + navigator.language +
                "<br>Online: " + navigator.onLine;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>

    <style>
        a:hover {
            color: red;
        }

        a:active {
            color: green;
        }

        input:focus {
            background-color: lightyellow;
        }

        a:visited {
            color: purple;
        }
    </style>
</head>

<body>

    <a href="https://example.com">Visit Website</a>

    <br><br>

    <input type="text" placeholder="Click here">

</body>
</html>

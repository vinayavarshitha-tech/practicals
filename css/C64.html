<!DOCTYPE html>
<html>
<head>
    <title>Mobile First Design</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .container {
            padding: 20px;
        }

        .card {
            padding: 30px;
            margin-bottom: 20px;
            background: lightblue;
        }

        /* Larger screens */
        @media (min-width: 768px) {
            .container {
                display: flex;
                gap: 20px;
            }

            .card {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <h2>Card 1</h2>
            <p>Mobile-first content.</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>Responsive layout.</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>Works on all screens.</p>
        </div>

    </div>

</body>
</html>

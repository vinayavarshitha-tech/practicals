<!DOCTYPE html>
<html>
<head>
    <title>Responsive Contact Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .form {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
        }

        button {
            padding: 12px 25px;
            background: blue;
            color: white;
            border: none;
        }

        @media (max-width: 600px) {
            .form {
                margin: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="form">

        <h1>Contact Us</h1>

        <input type="text" placeholder="Your Name">

        <input type="email" placeholder="Your Email">

        <textarea placeholder="Your Message"></textarea>

        <button>Send Message</button>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 40px;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Store</h1>
    </header>

    <div class="products">

        <div class="product">
            <img src="https://picsum.photos/250/150?1" alt="Product">
            <h2>Product 1</h2>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/250/150?2" alt="Product">
            <h2>Product 2</h2>
            <p>₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/250/150?3" alt="Product">
            <h2>Product 3</h2>
            <p>₹799</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>

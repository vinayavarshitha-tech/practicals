<!DOCTYPE html>
<html>
<head>
    <title>Button Hover Animation</title>

    <style>
        button {
            padding: 15px 30px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            transform: scale(1.1);
            background: purple;
        }
    </style>
</head>

<body>

    <h1>CSS Button Animation</h1>

    <button>Hover Me</button>

</body>
</html>

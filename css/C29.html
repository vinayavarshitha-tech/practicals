<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        :root {
            --main-color: blue;
            --padding: 20px;
        }

        h1 {
            color: var(--main-color);
        }

        .box {
            padding: var(--padding);
            border: 2px solid var(--main-color);
        }

        button {
            background: var(--main-color);
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Variables</h1>

    <div class="box">
        <p>This box uses CSS variables.</p>
        <button>Click Me</button>
    </div>

</body>
</html>

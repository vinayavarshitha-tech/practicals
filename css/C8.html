<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        img {
            float: left;
            width: 150px;
            margin-right: 20px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

    <img src="https://via.placeholder.com/150" alt="Sample">

    <p>
        This text flows around the image because the image is floated.
    </p>

    <p class="clear">
        This paragraph appears below the floated image.
    </p>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Transitions</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background: blue;
            transition: width 1s, height 1s, background 1s;
        }

        .box:hover {
            width: 250px;
            height: 250px;
            background: green;
        }
    </style>
</head>

<body>

    <h1>CSS Transition</h1>

    <div class="box"></div>

</body>
</html>

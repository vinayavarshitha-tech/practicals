<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 40px;
        }

        .food {
            width: 200px;
            padding: 25px;
            text-align: center;
            background: #eee;
            border-radius: 10px;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Food Corner</h1>
        <p>Delicious food for everyone</p>
    </header>

    <div class="menu">

        <div class="food">
            <h2>Pizza</h2>
            <p>Cheesy vegetable pizza</p>
            <p class="price">₹250</p>
        </div>

        <div class="food">
            <h2>Burger</h2>
            <p>Fresh vegetable burger</p>
            <p class="price">₹150</p>
        </div>

        <div class="food">
            <h2>Pasta</h2>
            <p>Creamy pasta</p>
            <p class="price">₹200</p>
        </div>

    </div>

</body>
</html>

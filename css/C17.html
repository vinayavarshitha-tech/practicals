<!DOCTYPE html>
<html>
<head>
    <title>Transitions and Transformations</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            transition: transform 0.5s;
        }

        .box:hover {
            transform: scale(1.5) rotate(10deg);
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
        }

        table {
            width: 60%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h2>Subjects</h2>

    <ul>
        <li>Python</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <h2>Student Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Varshitha</td>
            <td>90</td>
        </tr>
    </table>

</body>
</html>

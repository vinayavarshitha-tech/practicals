<!DOCTYPE html>
<html>
<head>
    <title>CSS Overflow</title>

    <style>
        .box {
            width: 250px;
            height: 100px;
            border: 2px solid black;
            overflow: auto;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Overflow Property</h1>

    <div class="box">
        This is a long paragraph used to demonstrate
        the overflow property in CSS. When the content
        becomes larger than the box, scrolling is shown.
    </div>

</body>
</html>

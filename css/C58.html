<!DOCTYPE html>
<html>
<head>
    <title>Travel Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .hero {
            height: 500px;
            background-image: url("https://picsum.photos/1200/600");
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding-top: 100px;
            box-sizing: border-box;
        }

        .destinations {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .place {
            width: 250px;
            padding: 25px;
            background: #eee;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Explore the World</h1>
        <p>Discover amazing destinations.</p>
    </div>

    <div class="destinations">

        <div class="place">
            <h2>Paris</h2>
            <p>Explore the city of lights.</p>
        </div>

        <div class="place">
            <h2>London</h2>
            <p>Discover history and culture.</p>
        </div>

        <div class="place">
            <h2>Tokyo</h2>
            <p>Experience modern Japan.</p>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Fonts and Text</title>

    <style>
        h1 {
            font-family: Arial;
            font-size: 35px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            text-decoration: underline;
        }

        p {
            line-height: 1.8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <h1>CSS Text Formatting</h1>

    <p>This is a paragraph demonstrating text properties.</p>

</body>
</html>

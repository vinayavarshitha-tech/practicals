<!DOCTYPE html>
<html>
<head>
    <title>Visibility</title>

    <style>
        .visible {
            display: block;
            background: lightgreen;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        .invisible {
            visibility: hidden;
        }
    </style>
</head>

<body>

    <h1>Visibility and Hiding</h1>

    <div class="visible">Visible Element</div>

    <div class="hidden">Hidden using display none</div>

    <div class="invisible">Hidden using visibility</div>

</body>
</html>

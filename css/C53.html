<!DOCTYPE html>
<html>
<head>
    <title>Responsive Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eee;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            box-shadow: 0 5px 15px gray;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: blue;
            color: white;
            border: none;
        }

        @media (max-width: 500px) {
            .container {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Login</button>

        <p>Don't have an account? Sign Up</p>

    </div>

</body>
</html>

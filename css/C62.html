<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Alignment</title>

    <style>
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 300px;
        }

        .box {
            padding: 30px;
            background: lightblue;
        }

        .first {
            order: 3;
        }

        .second {
            order: 1;
        }

        .third {
            order: 2;
        }
    </style>
</head>

<body>

    <h1>Flexbox Ordering</h1>

    <div class="container">

        <div class="box first">First</div>

        <div class="box second">Second</div>

        <div class="box third">Third</div>

    </div>

</body>
</html>

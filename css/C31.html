<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients</title>

    <style>
        .linear {
            height: 150px;
            background: linear-gradient(to right, blue, purple);
            color: white;
            padding: 20px;
        }

        .radial {
            height: 150px;
            background: radial-gradient(circle, yellow, orange);
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="linear">
        <h2>Linear Gradient</h2>
    </div>

    <div class="radial">
        <h2>Radial Gradient</h2>
    </div>

</body>
</html>

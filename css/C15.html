<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .box {
            padding: 30px;
            background-color: lightblue;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>2D and 3D Transformations</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background: lightblue;
            margin: 50px;
            padding: 20px;
            transition: 1s;
        }

        .box:hover {
            transform: rotate(20deg) scale(1.2);
        }

        .three-d {
            width: 150px;
            height: 150px;
            background: orange;
            margin: 50px;
            transition: 1s;
        }

        .three-d:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <h1>Transformations</h1>

    <div class="box">
        2D Transform
    </div>

    <div class="three-d">
        3D Transform
    </div>

</body>
</html>

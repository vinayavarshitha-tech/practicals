<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        p {
            color: blue;
        }

        /* Class selector */
        .highlight {
            background-color: yellow;
        }

        /* ID selector */
        #special {
            color: red;
        }

        /* Universal selector */
        * {
            font-family: Arial;
        }

        /* Group selector */
        h1, h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>
    <h2>Different Types</h2>

    <p>This uses an element selector.</p>

    <p class="highlight">This uses a class selector.</p>

    <p id="special">This uses an ID selector.</p>

</body>
</html>

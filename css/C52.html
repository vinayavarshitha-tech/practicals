 <!DOCTYPE html>
<html>
<head>
    <title>Responsive Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .content {
            min-height: 500px;
            padding: 30px;
        }

        footer {
            background: #333;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 30px;
            flex-wrap: wrap;
        }

        .footer-section {
            margin: 10px;
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>My Website</h1>
        <p>This is the main content.</p>
    </div>

    <footer>

        <div class="footer-section">
            <h3>About</h3>
            <p>About our website</p>
        </div>

        <div class="footer-section">
            <h3>Contact</h3>
            <p>contact@example.com</p>
        </div>

        <div class="footer-section">
            <h3>Follow Us</h3>
            <p>Instagram | Facebook</p>
        </div>

    </footer>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: sticky;
            top: 0;
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        section {
            height: 500px;
            padding: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sticky Header</h1>
    </header>

    <section>
        <h2>Section 1</h2>
        <p>Scroll down to see the sticky header.</p>
    </section>

    <section>
        <h2>Section 2</h2>
        <p>The header stays at the top.</p>
    </section>

    <section>
        <h2>Section 3</h2>
        <p>This demonstrates position: sticky.</p>
    </section>

</body>
</html>

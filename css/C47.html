<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Grid</title>

    <style>
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            padding: 30px;
            background: lightblue;
            text-align: center;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Dashboard</h1>

    <div class="dashboard">

        <div class="card">Students</div>
        <div class="card">Courses</div>
        <div class="card">Teachers</div>
        <div class="card">Reports</div>
        <div class="card">Attendance</div>
        <div class="card">Results</div>

    </div>

</body>
</html>

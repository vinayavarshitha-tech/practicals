<!DOCTYPE html>
<html>
<head>
    <title>Image Hover Effect</title>

    <style>
        .image {
            width: 400px;
            transition: 0.5s;
        }

        .image:hover {
            transform: scale(1.1);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <h1>Image Hover Effect</h1>

    <img
        class="image"
        src="https://picsum.photos/400/250"
        alt="Sample Image"
    >

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Tooltip</title>

    <style>
        .tooltip {
            position: relative;
            display: inline-block;
            margin: 50px;
            padding: 15px;
            background: blue;
            color: white;
        }

        .text {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background: black;
            color: white;
            padding: 10px;
            width: 150px;
        }

        .tooltip:hover .text {
            display: block;
        }
    </style>
</head>

<body>

    <h1>Tooltip Example</h1>

    <div class="tooltip">
        Hover Me
        <span class="text">This is a tooltip.</span>
    </div>

</body>
</html>

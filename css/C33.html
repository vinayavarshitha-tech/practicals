<!DOCTYPE html>
<html>
<head>
    <title>Border Radius</title>

    <style>
        .square {
            width: 150px;
            height: 100px;
            background: lightblue;
            border-radius: 20px;
            margin: 20px;
        }

        .circle {
            width: 120px;
            height: 120px;
            background: orange;
            border-radius: 50%;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Border Radius Shapes</h1>

    <div class="square"></div>

    <div class="circle"></div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        form {
            width: 350px;
            padding: 20px;
            border: 2px solid black;
            margin: auto;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Registration Form</h1>

    <form>
        <label>Name:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <label>Course:</label>
        <select>
            <option>Python</option>
            <option>Web Development</option>
        </select>

        <button type="submit">Register</button>
    </form>

</body>
</html>

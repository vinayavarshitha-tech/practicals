<!DOCTYPE html>
<html>
<head>
    <title>Card Layout</title>

    <style>
        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 200px;
            padding: 20px;
            background: #eee;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Card Layout Using Flexbox</h1>

    <div class="cards">

        <div class="card">
            <h2>Card 1</h2>
            <p>First card</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>Second card</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>Third card</p>
        </div>

    </div>

</body>
</html>

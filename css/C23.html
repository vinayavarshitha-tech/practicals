<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-card {
            width: 300px;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: #ddd;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 60px;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h2 {
            margin-bottom: 10px;
        }

        .product-info p {
            color: #666;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        .buy-button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
        }

        .buy-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <div class="product-image">
            🎧
        </div>

        <div class="product-info">

            <h2>Wireless Headphones</h2>

            <p>
                Comfortable wireless headphones
                with high-quality sound.
            </p>

            <div class="price">₹1,999</div>

            <a href="#" class="buy-button">
                Buy Now
            </a>

        </div>

    </div>

</body>

</html>

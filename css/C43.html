<!DOCTYPE html>
<html>
<head>
    <title>CSS Filters</title>

    <style>
        img {
            width: 300px;
            filter: grayscale(100%);
            transition: 0.5s;
        }

        img:hover {
            filter: none;
        }
    </style>
</head>

<body>

    <h1>CSS Filter</h1>

    <img src="https://picsum.photos/400/300" alt="Sample Image">

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        * {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .box {
            background: lightblue;
        }

        #special {
            color: red;
        }

        input[type="text"] {
            border: 2px solid green;
        }

        h2, p {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2 class="box">Class Selector</h2>

    <p id="special">ID Selector</p>

    <input type="text" placeholder="Attribute selector">

</body>
</html>

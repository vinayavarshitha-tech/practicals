<!DOCTYPE html>
<html>
<head>
    <title>Complete Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #555;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: #eee;
        }

        .section {
            padding: 40px;
            text-align: center;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">
    <h2>Welcome to My Website</h2>
    <p>A simple complete homepage using CSS.</p>
</div>

<div class="section">
    <h2>About Us</h2>
    <p>We provide useful services and information.</p>
</div>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>

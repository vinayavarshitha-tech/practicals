<!DOCTYPE html>
<html>
<head>
    <title>Shadows</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h1 {
            text-shadow: 3px 3px 5px gray;
        }

        .box {
            width: 250px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            box-shadow: 5px 5px 15px gray;
        }
    </style>
</head>

<body>

    <h1>Text Shadow</h1>

    <div class="box">
        <h2>Box Shadow</h2>
        <p>This box has a shadow.</p>
    </div>

</body>
</html>

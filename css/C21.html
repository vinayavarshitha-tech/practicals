<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .profile {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .info {
            margin-top: 25px;
        }

        .info p {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .label {
            font-weight: bold;
            color: #2563eb;
        }

        .college {
            text-align: center;
            background-color: #2563eb;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="college">
            <h2>ABC College of Engineering</h2>
            <p>Student Profile</p>
        </div>

        <h1>Student Details</h1>

        <div class="info">

            <p>
                <span class="label">Name:</span>
                Vinayavarshitha
            </p>

            <p>
                <span class="label">Register Number:</span>
                123456
            </p>

            <p>
                <span class="label">Course:</span>
                Computer Science
            </p>

            <p>
                <span class="label">Year:</span>
                Undergraduate
            </p>

            <p>
                <span class="label">Email:</span>
                student@example.com
            </p>

        </div>

    </div>

</body>

</html>

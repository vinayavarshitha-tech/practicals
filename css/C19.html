<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation</title>

    <style>
        nav {
            background-color: black;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px;
            display: inline-block;
        }

        nav a:hover {
            background-color: gray;
        }

        @media screen and (max-width: 600px) {
            nav a {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>

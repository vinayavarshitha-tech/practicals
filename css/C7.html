<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>
        .static {
            position: static;
        }

        .relative {
            position: relative;
            left: 30px;
        }

        .container {
            position: relative;
            height: 200px;
            border: 2px solid black;
        }

        .absolute {
            position: absolute;
            top: 50px;
            right: 20px;
        }

        .fixed {
            position: fixed;
            bottom: 10px;
            right: 10px;
        }

        .sticky {
            position: sticky;
            top: 0;
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div class="static">Static Position</div>

    <div class="relative">Relative Position</div>

    <div class="container">
        <div class="absolute">Absolute Position</div>
    </div>

    <div class="sticky">Sticky Position</div>

    <div class="fixed">Fixed Position</div>

    <p style="height:1000px;">Scroll the page.</p>

</body>
</html>

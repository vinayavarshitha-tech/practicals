<!DOCTYPE html>
<html>
<head>
    <title>Opacity</title>

    <style>
        .box {
            width: 200px;
            height: 150px;
            background: blue;
            margin: 20px;
            color: white;
            padding: 20px;
        }

        .transparent {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="box">
        Normal Box
    </div>

    <div class="box transparent">
        Transparent Box
    </div>

</body>
</html>
